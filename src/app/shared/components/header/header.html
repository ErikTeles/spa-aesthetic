<header class="header">
  <mat-toolbar class="mat-toolbar">
    <a routerLink="/" class="logo">
      <h1>Spa<span>Aesthetic</span></h1>
    </a>

    <nav class="nav-icons">
      <div class="cart">
        <a routerLink="/carrinho"
          ><img src="icons/shopping-cart.png" alt="Carrinho de compras"
        /></a>
        @if (cartService.cartItemsCount() > 0) {
          <span class="badge">{{ cartService.cartItemsCount() }}</span>
        }
      </div>

      <div>
        <a routerLink="/cadastro"><img src="icons/user-profile.png" alt="Perfil do usuário" /></a>
      </div>
    </nav>
  </mat-toolbar>
</header>
