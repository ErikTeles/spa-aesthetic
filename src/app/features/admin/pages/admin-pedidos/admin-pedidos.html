<table mat-table [dataSource]="atendimentos()" class="">
  <ng-container matColumnDef="idAtendimento">
    <th mat-header-cell *matHeaderCellDef>Pedido</th>
    <td mat-cell *matCellDef="let atendimento">#{{ atendimento.idAtendimento }}</td>
  </ng-container>

  <ng-container matColumnDef="cliente">
    <th mat-header-cell *matHeaderCellDef>Cliente</th>
    <td mat-cell *matCellDef="let atendimento">{{ nomeCliente(atendimento.idPessoa) }}</td>
  </ng-container>

  <ng-container matColumnDef="dataAtendimento">
    <th mat-header-cell *matHeaderCellDef>Data</th>
    <td mat-cell *matCellDef="let atendimento">
      {{ formatarData(atendimento.dataAtendimento) }}
    </td>
  </ng-container>

  <ng-container matColumnDef="statusAtendimento">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let atendimento">{{ atendimento.statusAtendimento }}</td>
  </ng-container>

  <ng-container matColumnDef="quantidadeItens">
    <th mat-header-cell *matHeaderCellDef>Itens</th>
    <td mat-cell *matCellDef="let atendimento">{{ quantidadeItens(atendimento) }}</td>
  </ng-container>

  <ng-container matColumnDef="valorTotal">
    <th mat-header-cell *matHeaderCellDef>Total</th>
    <td mat-cell *matCellDef="let atendimento">
      R$ {{ totalAtendimento(atendimento) | number: '1.2-2' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let atendimento">
      <button matIconButton aria-label="Editar pedido" (click)="openEditDialog(atendimento)">
        <mat-icon>edit</mat-icon>
      </button>
      <button matIconButton aria-label="Excluir pedido" (click)="excluirAtendimento(atendimento)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div class="fab-container">
  <button matFab aria-label="Novo pedido" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
