<form class="search-bar" [formGroup]="formBusca" (ngSubmit)="buscarPorId()">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
    <mat-label>Buscar categoria por ID</mat-label>
    <input matInput type="number" min="1" step="1" formControlName="idCategoria" />
  </mat-form-field>

  <button matButton="filled" type="submit">Buscar</button>

  @if (consultaAtiva()) {
    <button matButton type="button" (click)="limparBusca()">Limpar</button>
  }
</form>

@if (consultaAtiva()) {
  <p class="search-info">Exibindo resultado para o ID {{ idConsultado() }}.</p>
}

<table mat-table [dataSource]="categorias()" class="">
  <ng-container matColumnDef="idCategoria">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let categoria">{{ categoria.idCategoria }}</td>
  </ng-container>

  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef>Descrição</th>
    <td mat-cell *matCellDef="let categoria">{{ categoria.descricao }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let categoria">
      <button matIconButton aria-label="Editar categoria" (click)="openEditDialog(categoria)">
        <mat-icon>edit</mat-icon>
      </button>
      <button
        matIconButton
        aria-label="Excluir categoria"
        (click)="excluirCategoria(categoria)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

@if (!carregando() && categorias().length === 0) {
  <p class="empty-state">Nenhuma categoria encontrada.</p>
}

<div class="fab-container">
  <button matFab aria-label="Nova categoria" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
