<table mat-table [dataSource]="funcionarios()" class="">
  <ng-container matColumnDef="cpf">
    <th mat-header-cell *matHeaderCellDef>CPF</th>
    <td mat-cell *matCellDef="let funcionario">{{ funcionario.cpf }}</td>
  </ng-container>

  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let funcionario">{{ funcionario.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>E-mail</th>
    <td mat-cell *matCellDef="let funcionario">{{ funcionario.email }}</td>
  </ng-container>

  <ng-container matColumnDef="cargo">
    <th mat-header-cell *matHeaderCellDef>Cargo</th>
    <td mat-cell *matCellDef="let funcionario">{{ funcionario.cargo }}</td>
  </ng-container>

  <ng-container matColumnDef="dataAdmissao">
    <th mat-header-cell *matHeaderCellDef>Data de Admissão</th>
    <td mat-cell *matCellDef="let funcionario">
      {{ formatarData(funcionario.dataAdmissao) }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let funcionario">
      <button matIconButton aria-label="Editar funcionário" (click)="openEditDialog(funcionario)">
        <mat-icon>edit</mat-icon>
      </button>
      <button
        matIconButton
        aria-label="Excluir funcionário"
        (click)="excluirFuncionario(funcionario)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div class="fab-container">
  <button matFab aria-label="Novo funcionário" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
