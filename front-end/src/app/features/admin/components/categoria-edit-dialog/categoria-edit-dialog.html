<h2 mat-dialog-title>{{ editando ? 'Editar categoria' : 'Nova categoria' }}</h2>

<form [formGroup]="formCategoria" (ngSubmit)="salvar()">
  <mat-dialog-content class="mat-typography">
    <div class="form-fields">
      <mat-form-field>
        <mat-label>Descrição</mat-label>
        <input matInput placeholder="Cuidados com a pele" formControlName="descricao" required />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close [disabled]="salvando()">Cancelar</button>
    <button matButton="filled" type="submit" [disabled]="formCategoria.invalid || salvando()">
      Salvar
    </button>
  </mat-dialog-actions>
</form>
