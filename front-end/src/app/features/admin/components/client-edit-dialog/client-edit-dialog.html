<h2 mat-dialog-title>Editar cliente</h2>

<form [formGroup]="formPessoa" (ngSubmit)="salvar()">
  <mat-dialog-content class="mat-typography">
    <div class="form-fields">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput placeholder="Fulano da Silva" formControlName="nome" required />
      </mat-form-field>

      <mat-form-field>
        <mat-label>CPF</mat-label>
        <input
          matInput
          appCpfMask
          placeholder="000.000.000-00"
          formControlName="cpf"
          inputmode="numeric"
          maxlength="14"
        />
        <mat-hint>O CPF não pode ser alterado</mat-hint>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Data de Nascimento</mat-label>
        <input
          matInput
          placeholder="31/12/1990"
          [matDatepicker]="datePicker"
          formControlName="dataNascimento"
          required
        />
        <mat-hint>DD/MM/AAAA</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
        <mat-datepicker #datePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Sexo</mat-label>
        <mat-select formControlName="sexo" required>
          <mat-option value="" disabled>Selecione</mat-option>
          <mat-option value="M">Masculino</mat-option>
          <mat-option value="F">Feminino</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput placeholder="fulano@email.com" formControlName="email" required />
        @if (formPessoa.get('email')?.invalid && formPessoa.get('email')?.touched) {
          <mat-error>E-mail Inválido</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Telefone</mat-label>
        <input
          matInput
          appCelularMask
          placeholder="(00) 00000-0000"
          formControlName="telefone"
          inputmode="numeric"
          maxlength="15"
          required
        />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close [disabled]="salvando()">Cancelar</button>
    <button matButton="filled" type="submit" [disabled]="formPessoa.invalid || salvando()">
      Salvar
    </button>
  </mat-dialog-actions>
</form>
