<table mat-table [dataSource]="servicos()" class="">
  <ng-container matColumnDef="nomeItem">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let servico">{{ servico.nomeItem }}</td>
  </ng-container>

  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef>Categoria</th>
    <td mat-cell *matCellDef="let servico">{{ servico.categoria?.descricao }}</td>
  </ng-container>

  <ng-container matColumnDef="preco">
    <th mat-header-cell *matHeaderCellDef>Preço</th>
    <td mat-cell *matCellDef="let servico">R$ {{ servico.preco | number: '1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="ativo">
    <th mat-header-cell *matHeaderCellDef>Ativo</th>
    <td mat-cell *matCellDef="let servico">{{ servico.ativo ? 'Sim' : 'Não' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let servico">
      <button matIconButton aria-label="Editar serviço" (click)="openEditDialog(servico)">
        <mat-icon>edit</mat-icon>
      </button>
      <button matIconButton aria-label="Excluir serviço" (click)="excluirServico(servico)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div class="fab-container">
  <button matFab aria-label="Novo serviço" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
